name: Publish Container

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/casual-loops/domain-doctor

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                -u "${{ github.actor }}" \
                --password-stdin

      - name: Build and publish branch image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build \
            -t "${IMAGE_NAME}:main" \
            -t "${IMAGE_NAME}:sha-${GITHUB_SHA::12}" \
            .

          docker push "${IMAGE_NAME}:main"
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA::12}"

      - name: Build and publish release image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          docker build \
            -t "${IMAGE_NAME}:${VERSION}" \
            -t "${IMAGE_NAME}:latest" \
            .

          docker push "${IMAGE_NAME}:${VERSION}"
          docker push "${IMAGE_NAME}:latest"
