<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>
			{% block title %}Domain Doctor | Open-Source Domain Diagnostics{% endblock
			%}
		</title>

		<meta name="application-name" content="Domain Doctor" />
		<meta name="theme-color" content="#0a0c0f" />
		<meta name="color-scheme" content="dark light" />

		<meta
			name="description"
			content="{% block meta_description %}Open-source domain diagnostics for understanding how domains actually work.{% endblock %}"
		/>

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Domain Doctor" />
		<meta
			property="og:title"
			content="{% block og_title %}Domain Doctor | Open-Source Domain Diagnostics{% endblock %}"
		/>
		<meta
			property="og:description"
			content="{% block og_description %}Open-source domain diagnostics for understanding how domains actually work.{% endblock %}"
		/>
		<meta
			property="og:url"
			content="{% block og_url %}https://domaindoctor.fyi/{% endblock %}"
		/>
		<meta
			property="og:image"
			content="https://domaindoctor.fyi/static/images/domain-doctor-social.png"
		/>

		<meta name="twitter:card" content="summary_large_image" />
		<meta
			name="twitter:title"
			content="{% block twitter_title %}Domain Doctor | Open-Source Domain Diagnostics{% endblock %}"
		/>
		<meta
			name="twitter:description"
			content="{% block twitter_description %}Open-source domain diagnostics for understanding how domains actually work.{% endblock %}"
		/>
		<meta
			name="twitter:image"
			content="https://domaindoctor.fyi/static/images/domain-doctor-social.png"
		/>

		{% block head_meta %}{% endblock %}

		<link rel="icon" href="/static/favicon.ico" sizes="any" />
		<link
			rel="apple-touch-icon"
			href="/static/images/domain-doctor-favicon.png"
		/>
		<link rel="stylesheet" href="/static/style.css" />

		{% block styles %}{% endblock %}

		<script src="/static/app.js" defer></script>
	</head>

	<body>
		<div class="site-shell">
			{% include "partials/site_header.html" %} {% block main %}{% endblock %}
			{% include "partials/site_footer.html" %}
		</div>

		{% block overlays %}{% endblock %}
	</body>
</html>
